asyncapi: '2.6.0'
info:
  title: GaggiMate WebSocket API
  version: '1.0.0'
  description: |
    This document describes the WebSocket interface exposed by the
    GaggiMate display firmware. Clients connect to `/ws` using the
    `ws://` or `wss://` protocol. Messages are JSON objects containing
    a `tp` field that specifies the type of message.
servers:
  production:
    url: '{protocol}://{host}/ws'
    protocol: ws
    description: WebSocket server
    variables:
      protocol:
        enum: [ws, wss]
        default: ws
      host:
        default: localhost
channels:
  '/ws':
    description: All messages share the same WebSocket channel.
    subscribe:
      description: Messages sent from the server to the client.
      message:
        oneOf:
          - $ref: '#/components/messages/StatusEvent'
          - $ref: '#/components/messages/OtaSettingsResponse'
          - $ref: '#/components/messages/OtaProgressEvent'
          - $ref: '#/components/messages/AutotuneResultEvent'
          - $ref: '#/components/messages/ProfilesListResponse'
          - $ref: '#/components/messages/ProfilesLoadResponse'
          - $ref: '#/components/messages/ProfilesSaveResponse'
          - $ref: '#/components/messages/ProfilesDeleteResponse'
          - $ref: '#/components/messages/ProfilesSelectResponse'
          - $ref: '#/components/messages/ProfilesFavoriteResponse'
          - $ref: '#/components/messages/ProfilesUnfavoriteResponse'
          - $ref: '#/components/messages/ProfilesReorderResponse'
          - $ref: '#/components/messages/BrewConfirmEvent'
          - $ref: '#/components/messages/BrewConfirmCancelEvent'
          - $ref: '#/components/messages/FlushStartResponse'
          - $ref: '#/components/messages/FlushStopResponse'
    publish:
      description: Messages sent from the client to the server.
      message:
        oneOf:
          - $ref: '#/components/messages/OtaSettingsRequest'
          - $ref: '#/components/messages/OtaStartRequest'
          - $ref: '#/components/messages/AutotuneStartRequest'
          - $ref: '#/components/messages/ProfilesListRequest'
          - $ref: '#/components/messages/ProfilesLoadRequest'
          - $ref: '#/components/messages/ProfilesSaveRequest'
          - $ref: '#/components/messages/ProfilesDeleteRequest'
          - $ref: '#/components/messages/ProfilesSelectRequest'
          - $ref: '#/components/messages/ProfilesFavoriteRequest'
          - $ref: '#/components/messages/ProfilesUnfavoriteRequest'
          - $ref: '#/components/messages/ProfilesReorderRequest'
          - $ref: '#/components/messages/ProcessActivateRequest'
          - $ref: '#/components/messages/BrewConfirmCancelRequest'
          - $ref: '#/components/messages/FlushStartRequest'
          - $ref: '#/components/messages/FlushStopRequest'
components:
  schemas:
    StatusPayload:
      type: object
      description: >-
        Partial by design: a frame carries either the fast telemetry (every 500 ms) or the
        slow-changing state (sent when it changes, at least every 10 s, and in full to a client
        right after it connects). Consumers merge each frame onto their last known status; a key
        that is absent keeps its previous value, a key sent as null clears it.
      properties:
        tp:
          type: string
          enum: ['evt:status']
        ct:
          type: number
          description: Current temperature
        tt:
          type: number
          description: Target temperature
        pr:
          type: number
          description: Current pressure
        fl:
          type: number
          description: Current flow
        sys:
          type: object
          description: Display system state (slow-state frame), mirrors the standby screen label.
          properties:
            s:
              type: string
              enum: [starting, waiting, ready, updating, autotuning, mismatch, error]
            m:
              type: string
              description: Human-readable message shown on the display, empty when ready
            c:
              type: integer
              description: Controller error code (0 = none)
        warn:
          type: array
          description: Machine warnings, one entry per warning type.
          items:
            $ref: '#/components/schemas/WarningState'
        pt:
          type: number
          description: Target pressure
        m:
          type: integer
          description: Machine mode
        p:
          type: string
          description: Selected profile label
        cp:
          type: boolean
          description: Indicates pressure capability
        cd:
          type: boolean
          description: Indicates dimming capability
      required: [tp]
    WarningState:
      type: object
      properties:
        k:
          type: string
          enum: [water, flush, switch, scaleConnected, scaleBattery, temperature]
          description: Warning key
        l:
          type: integer
          enum: [0, 1, 2]
          description: Configured severity (0 = ignore, 1 = warn, 2 = error)
        a:
          type: boolean
          description: Whether the underlying condition is currently true
      required: [k, l]

    OtaSettingsPayload:
      type: object
      properties:
        tp:
          type: string
          enum: ['res:ota-settings']
        latestVersion:
          type: string
        displayVersion:
          type: string
        controllerVersion:
          type: string
        hardware:
          type: string
        displayUpdateAvailable:
          type: boolean
        controllerUpdateAvailable:
          type: boolean
        channel:
          type: string
        updating:
          type: boolean
      required: [tp]
    OtaProgressPayload:
      type: object
      properties:
        tp:
          type: string
          enum: ['evt:ota-progress']
        phase:
          type: integer
        progress:
          type: integer
      required: [tp, phase, progress]
    AutotuneResultPayload:
      type: object
      properties:
        tp:
          type: string
          enum: ['evt:autotune-result']
        pid:
          type: string
      required: [tp, pid]
    ProfilePayload:
      $ref: '../schema/profile.json'
  messages:
    StatusEvent:
      payload:
        $ref: '#/components/schemas/StatusPayload'
    OtaSettingsResponse:
      payload:
        $ref: '#/components/schemas/OtaSettingsPayload'
    OtaProgressEvent:
      payload:
        $ref: '#/components/schemas/OtaProgressPayload'
    AutotuneResultEvent:
      payload:
        $ref: '#/components/schemas/AutotuneResultPayload'
    ProfilesListResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:list']
          rid:
            type: string
          profiles:
            type: array
            items:
              $ref: '#/components/schemas/ProfilePayload'
          error:
            type: string
        required: [tp]
    ProfilesLoadResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:load']
          rid:
            type: string
          profile:
            $ref: '#/components/schemas/ProfilePayload'
          error:
            type: string
        required: [tp]
    ProfilesSaveResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:save']
          rid:
            type: string
          profile:
            $ref: '#/components/schemas/ProfilePayload'
          error:
            type: string
        required: [tp]
    ProfilesDeleteResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:delete']
          rid:
            type: string
          error:
            type: string
        required: [tp]
    ProfilesSelectResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:select']
          rid:
            type: string
          error:
            type: string
        required: [tp]
    ProfilesFavoriteResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:favorite']
          rid:
            type: string
          error:
            type: string
        required: [tp]
    ProfilesUnfavoriteResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:unfavorite']
          rid:
            type: string
          error:
            type: string
        required: [tp]
    OtaSettingsRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:ota-settings']
          update:
            type: boolean
          channel:
            type: string
        required: [tp]
    OtaStartRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:ota-start']
          cp:
            type: string
        required: [tp]
    AutotuneStartRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:autotune-start']
          time:
            type: integer
          samples:
            type: integer
        required: [tp]
    ProfilesListRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:list']
          rid:
            type: string
        required: [tp]
    ProfilesLoadRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:load']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesSaveRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:save']
          rid:
            type: string
          profile:
            $ref: '#/components/schemas/ProfilePayload'
        required: [tp, profile]
    ProfilesDeleteRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:delete']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesSelectRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:select']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesFavoriteRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:favorite']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesUnfavoriteRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:unfavorite']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesReorderRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:reorder']
          rid:
            type: string
          order:
            type: array
            items:
              type: string
            description: Full ordered list of profile IDs.
        required: [tp, order]

    ProfilesReorderResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:reorder']
          rid:
            type: string
          # No error field; success implied
        required: [tp]

    BrewConfirmEvent:
      summary: A brew start was blocked by an error-level warning and needs confirmation.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:brew:confirm']
          warn:
            type: array
            description: Active warnings that are not ignored (active flag omitted, always true).
            items:
              $ref: '#/components/schemas/WarningState'
        required: [tp, warn]

    ProcessActivateRequest:
      summary: Start the process for the current mode.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:process:activate']
          ignoreWarnings:
            type: boolean
            default: false
            description: Start the brew even though an error-level warning is active (answer to evt:brew:confirm).
        required: [tp]

    BrewConfirmCancelEvent:
      summary: A UI declined the brew confirmation; every client should dismiss its dialog. A confirmed start is visible as an active process in evt:status.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:brew:confirm:cancel']
        required: [tp]

    FlushStartRequest:
      summary: Start a flush (brew valve open, pump on) for the configured flush duration; with duration 0 it runs until req:flush:stop. The valve stays open for one more second after the pump stops.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:flush:start']
          rid:
            type: string
        required: [tp]
    FlushStartResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:flush:start']
          rid:
            type: string
          success:
            type: boolean
        required: [tp]
    FlushStopRequest:
      summary: End a hold-to-flush (flush duration 0). Ignored while a fixed-length flush runs.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:flush:stop']
          rid:
            type: string
        required: [tp]
    FlushStopResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:flush:stop']
          rid:
            type: string
          success:
            type: boolean
        required: [tp]
    BrewConfirmCancelRequest:
      summary: Decline the pending brew confirmation on behalf of all UIs.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:brew:confirm:cancel']
        required: [tp]
