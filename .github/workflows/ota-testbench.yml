name: OTA test bench
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ota-testbench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: OTA download unit tests and chaos load test
        env:
          OTA_LOAD_ITERATIONS: 60
        run: scripts/ota_testbench.sh
